// Simple horizontal bar chart, no external chart library needed
function SimpleBarChart({ data, colors }) {
  const max = Math.max(...data.map((d) => d.count));
  return (
    <div className="space-y-3">
      {data.map((d, i) => (
        <div key={d.name} className="flex items-center gap-3">
          <div className="w-36 text-xs text-slate-600 text-right shrink-0">{d.name}</div>
          <div className="flex-1 bg-slate-100 rounded-md h-6 overflow-hidden relative">
            <div
              className="h-full rounded-md flex items-center justify-end pr-2 transition-all"
              style={{ width: `${(d.count / max) * 100}%`, backgroundColor: colors[i % colors.length] }}
            >
              <span className="text-white text-xs font-mono font-medium">{d.count}</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function LedgerStrip({ counts, total, height = "h-8", showLabels = true }) {
  const order = ["HIGH", "MEDIUM", "LOW_REVIEW"];
  return (
    <div className="w-full">
      <div className={`w-full ${height} rounded-md overflow-hidden flex border border-slate-300`}>
        {order.map((k) => {
          const v = counts[k] || 0;
          const pct = total ? (v / total) * 100 : 0;
          if (pct === 0) return null;
          return (
            <div
              key={k}
              className={`${CONF_COLOR[k].bar} h-full flex items-center justify-center transition-all`}
              style={{ width: `${pct}%` }}
              title={`${CONF_LABEL[k]}: ${v} (${pct.toFixed(1)}%)`}
            />
          );
        })}
      </div>
      {showLabels && (
        <div className="flex flex-wrap gap-x-5 gap-y-1 mt-2">
          {order.map((k) => {
            const v = counts[k] || 0;
            const pct = total ? ((v / total) * 100).toFixed(1) : "0.0";
            return (
              <div key={k} className="flex items-center gap-1.5 text-xs">
                <span className={`w-2 h-2 rounded-full ${CONF_COLOR[k].dot}`} />
                <span className="text-slate-500">{CONF_LABEL[k]}</span>
                <span className={`font-mono ${CONF_COLOR[k].text}`}>{v}</span>
                <span className="text-slate-400 font-mono">({pct}%)</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

      {sub && <div className="text-xs text-slate-500 mt-1">{sub}</div>}
    </div>
  );
}

                <div><span className="text-slate-400">Mfg_Part_Num</span> <span className="text-slate-800">PDSH4816AF</span></div>
                <div><span className="text-slate-400">Part_Desc</span> <span className="text-slate-800">PDSH4816AF Dishwasher SS - Display Only</span></div>
                <div><span className="text-slate-400">E1_Brand</span> <span className="text-rose-500">-- Unbranded --</span></div>
                <div><span className="text-slate-400">Unilog_Brand</span> <span className="text-rose-500">-- No Unilog Brand --</span></div>
                <div><span className="text-slate-400">Part_Manuf</span> <span className="text-slate-800">Appliance Dealers Cooperative (APPDE)</span></div>
              </div>
            </div>
            <div className="border border-emerald-200 rounded-lg overflow-hidden">
              <div className="px-4 py-2 bg-emerald-50 border-b border-emerald-200 text-xs font-semibold uppercase tracking-wide text-emerald-700">
                Enriched output
              </div>
              <div className="p-4 space-y-2 font-mono text-xs">
                <div><span className="text-slate-400">MANUFACTURER_NAME</span> <span className="text-slate-800">Electrolux</span></div>
                <div><span className="text-slate-400">BRAND_NAME</span> <span className="text-slate-800">Frigidaire</span></div>
                <div><span className="text-slate-400">INVOICE_DESC</span> <span className="text-slate-800">DISHWASHER SS 120V</span></div>
                <div><span className="text-slate-400">SHORT_DESC</span> <span className="text-slate-800">Frigidaire Professional PDSH4816AF Dishwasher With Stainless Steel, Multiple Wash Cycles, Quiet Operation</span></div>
                <div><span className="text-slate-400">ATTRIBUTE_LABEL 3 / VALUE / UOM</span> <span className="text-slate-800">Height / 33-7/8 / in</span></div>
                <div className="pt-1">
                  <span className={`text-[11px] px-2 py-0.5 rounded-full border ${CONF_COLOR.HIGH.chip}`}>HIGH CONFIDENCE</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div className="flex gap-1 border-b border-slate-200">
          {tabs.map((t) => (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${
                tab === t.id
                  ? "border-sky-600 text-sky-600"
                  : "border-transparent text-slate-500 hover:text-slate-700"
              }`}
            >
              {t.label}
            </button>
          ))}
        </div>

        {tab === "overview" && (
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <StatCard label="Unknown manufacturer" value={data_quality.unknown_manufacturer_count} sub="out of 1,000 rows — flagged, not hidden" accent="text-amber-600" />
            <StatCard label="Unknown brand" value={data_quality.unknown_brand_count} sub="out of 1,000 rows — flagged, not hidden" accent="text-amber-600" />
            <StatCard label="LLM call failures" value={data_quality.tier3_llm_call_failures} sub="Tier 3 enrichment — zero, after JSON-repair fix" accent="text-emerald-600" />

            <div className="md:col-span-3 bg-white border border-slate-200 rounded-lg p-5 mt-2 shadow-sm">
              <h3 className="text-sm font-semibold text-slate-800 mb-3">Tier architecture — depth by design</h3>
              <div className="space-y-3">
                {[
                  { tier: "Tier 1", rows: 10, desc: "Full 252-column depth · benchmarked 56.2% attribute accuracy vs. 12.5% LLM-only baseline against official worked examples · 2/10 manufacturer errors found & fixed via ground-truth verification" },
                  { tier: "Tier 2", rows: 74, desc: "Medium depth across 14 appliance sub-categories · 3/74 manufacturer errors found & fixed via ground-truth verification (all were HIGH-confidence misses — confidence tagging alone didn't catch them)" },
                  { tier: "Tier 3", rows: 916, desc: "Light depth, honest confidence flagging · 770/916 (84%) category-classified at zero LLM cost via manufacturer + keyword rules" },
                ].map((row) => (
                  <div key={row.tier} className="flex gap-4 text-sm">
                    <div className="w-16 shrink-0 font-mono text-sky-600">{row.tier}</div>
                    <div className="w-14 shrink-0 font-mono text-slate-500">{row.rows}</div>
                    <div className="text-slate-600">{row.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab === "category" && (
          <div className="grid grid-cols-1 lg:grid-cols-5 gap-5">
            <div className="lg:col-span-3 bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
              <h3 className="text-sm font-semibold text-slate-800 mb-1">Tier 3 category distribution</h3>
              <p className="text-xs text-slate-500 mb-4">916 rows across 7 categories</p>
              <SimpleBarChart data={categoryData} colors={CATEGORY_COLORS} />
            </div>

            <div className="lg:col-span-2 bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
              <h3 className="text-sm font-semibold text-slate-800 mb-1">Classification method</h3>
              <p className="text-xs text-slate-500 mb-4">how each row's category was decided</p>
              <div className="space-y-4">
                {methodOrder.map((m) => {
                  const v = category_method_breakdown_tier3[m.key];
                  const pct = ((v / methodTotal) * 100).toFixed(1);
                  return (
                    <div key={m.key}>
                      <div className="flex items-center justify-between text-xs mb-1">
                        <span className="text-slate-500">{m.label}</span>
                        <span className={`font-mono ${m.text}`}>{v} <span className="text-slate-400">({pct}%)</span></span>
                      </div>
                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div className={`h-full ${m.color} rounded-full`} style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="mt-5 pt-4 border-t border-slate-200 text-xs text-slate-500 leading-relaxed">
                <span className="text-slate-700 font-medium">84% classified free</span> — manufacturer-rule and keyword
                fallback resolve most rows before any LLM call. Only 49 rows (5.3%) need an LLM to classify category.
                Description generation still calls the LLM for all 916 rows — writing text isn't a rule-table task.
              </div>
            </div>
          </div>
        )}

        {tab === "review" && (
          <div className="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
            <div className="px-5 py-4 border-b border-slate-200">
              <h3 className="text-sm font-semibold text-slate-800">Rows flagged for human review</h3>
              <p className="text-xs text-slate-500 mt-0.5">
                LOW_CONFIDENCE_NEEDS_REVIEW tag — description too ambiguous/abbreviated for the model to be confident. Sample of {review_queue.length}.
              </p>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-200 bg-slate-50">
                    <th className="px-5 py-2.5 font-medium">MPN</th>
                    <th className="px-5 py-2.5 font-medium">Description</th>
                    <th className="px-5 py-2.5 font-medium">Brand</th>
                    <th className="px-5 py-2.5 font-medium">Manufacturer</th>
                    <th className="px-5 py-2.5 font-medium">Status</th>
                  </tr>
                </thead>
                <tbody>
                  {review_queue.map((row, i) => (
                    <tr key={i} className="border-b border-slate-100 hover:bg-slate-50">
                      <td className="px-5 py-2.5 font-mono text-xs text-sky-600 whitespace-nowrap">{row.mpn}</td>
                      <td className="px-5 py-2.5 text-slate-700">{row.desc}</td>
                      <td className="px-5 py-2.5 text-slate-500">{row.brand}</td>
                      <td className="px-5 py-2.5 text-slate-500">{row.manufacturer}</td>
                      <td className="px-5 py-2.5">
                        <span className={`text-[11px] px-2 py-0.5 rounded-full border ${CONF_COLOR.LOW_REVIEW.chip} font-mono whitespace-nowrap`}>
                          NEEDS REVIEW
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {tab === "live_demo" && <LiveDemo />}

        <footer className="text-xs text-slate-400 text-center pt-4 pb-8 border-t border-slate-200">
          Generated from tier1_llm_enriched.json · tier2_llm_enriched.json · tier3_enriched.json — snapshot, not the final schema-locked submission file
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Dashboard />);
</script>
</body>
</html>
